image: node:22

default:
  interruptible: true
  timeout: 1 minute

stages:
  - test
  - build

test:
  stage: test
  script:
    - npm ci
    - npm run test
  rules:
    - if: $CI_COMMIT_BRANCH

# NOTE: there is no deploy job here any more. GitLab is a mirror of the nostr
# repo; it runs tests (and the Android build below) on its own runner. The
# site deploy lives in .ngit/act/workflows/deploy-nsite.yml and runs on the
# ngit-ci coordinator, publishing birdstar.app as an nsite served by npanel.
# Nothing is rsynced to venus any more.

# Build a release APK for Android. Signs with the release keystore when the
# ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_PASSWORD CI/CD variables
# are set (key alias "upload"); otherwise produces an unsigned APK. Store
# publishing (Play/App Store) is intentionally not wired up.
#
# Runs automatically on semver tags (v1.2.3) and can be started manually on
# any branch pipeline.
build-apk:
  stage: build
  image: eclipse-temurin:21-jdk
  timeout: 30 minutes
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    ANDROID_HOME: /opt/android-sdk
  before_script:
    # System dependencies: Node, ImageMagick (icon generation), unzip.
    - apt-get update -qq
    - apt-get install -y -qq curl unzip imagemagick > /dev/null
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs > /dev/null
    - node --version
    - npm --version

    # Android SDK command-line tools.
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - printf 'y\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

    # Decode the signing keystore and migrate JKS -> PKCS12 for Gradle
    # compatibility, then write key.properties. Requires the CI/CD variables
    # ANDROID_KEYSTORE_BASE64 (file), KEYSTORE_PASSWORD, KEY_PASSWORD, with
    # key alias "upload". Absent these, build.gradle emits an unsigned APK.
    - |
      if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/my-upload-key.jks
        keytool -importkeystore \
          -srckeystore android/app/my-upload-key.jks \
          -destkeystore android/app/my-upload-key.keystore \
          -deststoretype pkcs12 \
          -srcstorepass "$KEYSTORE_PASSWORD" \
          -deststorepass "$KEYSTORE_PASSWORD" \
          -srcalias upload \
          -destalias upload \
          -noprompt
        rm android/app/my-upload-key.jks
        cat > android/key.properties << EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=upload
      storeFile=my-upload-key.keystore
      EOF
        echo "Release keystore configured — APK will be signed."
      else
        echo "No ANDROID_KEYSTORE_BASE64 set — building an unsigned APK."
      fi
  script:
    # Stamp version from the git tag when present (v2.1.0 -> 2.1.0); otherwise
    # keep the build.gradle defaults for manual branch runs. versionCode uses
    # the pipeline IID so it monotonically increases.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION_NAME="${CI_COMMIT_TAG#v}"
        VERSION_CODE="${CI_PIPELINE_IID}"
        echo "Building version $VERSION_NAME (code $VERSION_CODE) from tag $CI_COMMIT_TAG"
        sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
        sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
      else
        echo "Manual branch build — using build.gradle version defaults"
      fi

    # Web assets. `npm run build` also fetches the BirdNET model into
    # public/ so the packaged app can run Birds mode offline; a plain
    # `vite build` would ship an APK with no model.
    - npm ci
    - npm run build

    # Sync web assets into the Capacitor Android project, then generate the
    # launcher icons (gitignored build artifacts) into the mipmap dirs.
    - npx cap sync android
    - npm run generate:icons

    # Build the release APK.
    - cd android && chmod +x gradlew && ./gradlew assembleRelease && cd ..

    # Collect the APK under a predictable artifact path. The filename differs
    # depending on whether the build was signed (app-release.apk) or not
    # (app-release-unsigned.apk).
    - mkdir -p artifacts
    - |
      OUT=android/app/build/outputs/apk/release
      if [ -f "$OUT/app-release.apk" ]; then
        cp "$OUT/app-release.apk" artifacts/Birdstar.apk
      else
        cp "$OUT/app-release-unsigned.apk" artifacts/Birdstar.apk
      fi
    - ls -lh artifacts/
  artifacts:
    paths:
      - artifacts/Birdstar.apk
    expire_in: 30 days
  cache:
    key: android-gradle
    paths:
      - android/.gradle/
      - .gradle/
