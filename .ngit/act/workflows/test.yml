name: Test

# Typecheck / lint / unit tests / production build for the Birdstar client.
# ngit-ci watches .ngit/act/workflows/ and runs each job with `act` (GitHub
# Actions-compatible syntax) in a Linux container. Runs on every push and on
# every Nostr PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # tsc + eslint + vitest + production build (see package.json "test").
      # The first step of every npm script here fetches the BirdNET model
      # (~51 MB of weight shards) into public/birdnet, so this job is
      # network-bound on a cold runner -- hence the generous timeout.
      - run: npm run test
